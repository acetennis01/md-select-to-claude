<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Send to Claude Code options</title>
  <style>
    body { font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 12px 16px; width: 360px; }
    label { display: block; margin-bottom: 4px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; }
    .hint { color: #666; margin-top: 4px; }
    #status { margin-top: 10px; }
    button { margin-top: 10px; padding: 6px 12px; font: inherit; }
  </style>
</head>
<body>
  <label for="bridgeUrl">Bridge URL</label>
  <input id="bridgeUrl" type="url" placeholder="http://127.0.0.1:41417">
  <div class="hint">Must match the port the <code>mdclaude</code> bridge is listening on.</div>
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
